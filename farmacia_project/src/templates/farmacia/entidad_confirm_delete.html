{% extends 'base.html' %}
{% block title %}Eliminar {{ singular }} | FarmaPoint{% endblock %}
{% block content %}
<section class="card form-card">
    <h1>Confirmar eliminación</h1>
    <p>¿Seguro que deseas eliminar {{ singular|lower }} <strong>{{ objeto }}</strong>? Esta acción no se puede deshacer.</p>
    <form method="post">{% csrf_token %}<div class="actions"><button class="btn danger-btn" type="submit">Sí, eliminar</button><a class="btn secondary" href="{% url 'entidad_list' entidad %}">Cancelar</a></div></form>
</section>
{% endblock %}
