{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FarmaPoint{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/estilos.css' %}">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="{% url 'inicio' %}">FarmaPoint</a>
            <nav class="main-nav">
                <a href="{% url 'entidad_list' 'categoria' %}">Categorías</a>
                <a href="{% url 'entidad_list' 'producto' %}">Productos</a>
                <a href="{% url 'entidad_list' 'proveedor' %}">Proveedores</a>
                <a href="{% url 'entidad_list' 'cliente' %}">Clientes</a>
                <a href="{% url 'entidad_list' 'venta' %}">Ventas</a>
                <a href="{% url 'detalleventa_list' %}">Detalles de venta</a>
                <a href="{% url 'zona_list' %}">Zonas</a>
                <a href="{% url 'farmacia_list' %}">Nuevas boticas</a>
                <a href="{% url 'evaluacion_list' %}">Evaluaciones</a>
            </nav>
        </div>
    </header>
    <main class="container content">{% block content %}{% endblock %}</main>
</body>
</html>
